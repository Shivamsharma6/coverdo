<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none" role="img" aria-label="Coverdo Logo">
  <!-- The Hex-Shield Closed Loop Emblem -->
  <g transform="translate(0, 1)">
    <!-- Outer Pearl-White Shield Perimeter -->
    <path d="M19 3.5 L31 10.5 V27.5 L19 34.5 L7 27.5 V18" 
          stroke="#FAFDF7" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Inner Closed Routing Loop in Electric Lime -->
    <path d="M7 18 L19 25 L31 18 L19 11 L11 16" 
          stroke="#BAF915" 
          stroke-width="2.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Core Nexus Node -->
    <circle cx="19" cy="18" r="2.8" fill="#BAF915" />
  </g>
  
  <!-- Geometric Wordmark -->
  <text x="44" y="27" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="22" 
        font-weight="800" 
        letter-spacing="-0.035em" 
        fill="#FAFDF7">COVERDO</text>
</svg>
